<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCAR-F Trainer</title>
<style>
  :root {
    --navy: #0b2a4a; --navy-2: #133b66; --bar: #e9ecef; --line: #c9ced4; --ink: #1d232a; --muted: #5b6672;
    --ok: #1e7d32; --ok-bg: #e7f4ea; --ko: #b3261e; --ko-bg: #fbeaea; --warn: #9a6700; --warn-bg: #fff6dc;
    --sel: #dbe9fb; --focus: #1a5fb4;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font: 15px/1.5 Arial, "Helvetica Neue", Helvetica, sans-serif; color: var(--ink); background: #fff; display: flex; flex-direction: column; }
  button { font: inherit; cursor: pointer; border: 1px solid #8a949e; background: #fff; color: var(--ink); padding: 7px 16px; border-radius: 3px; }
  button:hover:not(:disabled) { background: #f1f4f7; }
  button:disabled { opacity: .45; cursor: default; }
  button.primary { background: var(--navy-2); border-color: var(--navy-2); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--navy); }
  button:focus-visible, label.opt:focus-within { outline: 2px solid var(--focus); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* exam chrome */
  header.top { background: var(--navy); color: #fff; display: flex; align-items: center; gap: 24px; padding: 0 20px; height: 52px; flex: none; }
  header.top .title { font-weight: bold; letter-spacing: .2px; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  header.top .meta { display: flex; gap: 22px; font-size: 14px; white-space: nowrap; }
  header.top .meta b { font-variant-numeric: tabular-nums; }
  header.top .timer.low b { color: #ffcf5c; }
  main { flex: 1; overflow: auto; }
  footer.bar { background: var(--bar); border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; padding: 10px 20px; flex: none; }
  footer.bar .spacer { flex: 1; }
  .flag-on { background: var(--warn-bg) !important; border-color: var(--warn) !important; color: var(--warn) !important; }

  .wrap { max-width: 980px; margin: 0 auto; padding: 22px 24px 40px; }
  .scenario { border: 1px solid var(--line); background: #f7f9fb; border-radius: 3px; margin-bottom: 18px; }
  .scenario summary { padding: 8px 14px; cursor: pointer; font-weight: bold; color: var(--navy-2); }
  .scenario p { margin: 0; padding: 0 14px 12px; color: #33404d; }
  .qhead { color: var(--muted); font-size: 13px; margin-bottom: 6px; display: flex; gap: 14px; flex-wrap: wrap; }
  .stem { font-size: 16px; margin: 0 0 18px; white-space: pre-wrap; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  label.opt { display: flex; gap: 12px; align-items: flex-start; border: 1px solid var(--line); border-radius: 3px; padding: 10px 14px; cursor: pointer; }
  label.opt:hover { background: #f6f8fa; }
  label.opt.checked { background: var(--sel); border-color: #7aa7dd; }
  label.opt input { margin-top: 4px; }
  label.opt .k { font-weight: bold; min-width: 18px; }
  label.opt.right { background: var(--ok-bg); border-color: var(--ok); }
  label.opt.wrong { background: var(--ko-bg); border-color: var(--ko); }
  .pickhint { font-size: 13px; color: var(--muted); margin: -8px 0 12px; }

  /* feedback */
  .fb { margin-top: 22px; border-top: 2px solid var(--line); padding-top: 16px; }
  .verdict { font-size: 18px; font-weight: bold; margin-bottom: 8px; }
  .verdict.ok { color: var(--ok); } .verdict.ko { color: var(--ko); }
  .rule { background: var(--warn-bg); border-left: 4px solid var(--warn); padding: 10px 14px; margin: 14px 0; }
  .rule h4 { margin: 0 0 4px; font-size: 14px; color: var(--warn); }
  .why { margin: 6px 0; padding: 8px 12px; border-left: 3px solid var(--line); background: #fafbfc; font-size: 14px; }
  .why.c { border-left-color: var(--ok); }
  .why b { margin-right: 6px; }
  .mastery-delta { font-size: 14px; color: var(--muted); }
  details.orig { margin-top: 4px; font-size: 12px; color: var(--muted); }
  details.orig > summary { cursor: pointer; }
  .cite a { color: var(--focus); font-size: 13px; }
  .lesson-card { border: 2px solid var(--warn); background: var(--warn-bg); padding: 16px 18px; border-radius: 4px; margin-bottom: 18px; }
  .lesson-card h3 { margin: 0 0 6px; color: var(--warn); }

  /* dashboard */
  h1 { font-size: 22px; margin: 0 0 4px; } h2 { font-size: 17px; margin: 28px 0 10px; color: var(--navy-2); }
  .sub { color: var(--muted); margin: 0 0 18px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
  .kpi { border: 1px solid var(--line); border-radius: 3px; padding: 10px 14px; }
  .kpi .v { font-size: 22px; font-weight: bold; font-variant-numeric: tabular-nums; }
  .kpi .l { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid #e3e6ea; vertical-align: middle; }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .4px; color: var(--muted); font-weight: normal; }
  td.num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .meter { position: relative; height: 12px; background: #edf0f3; border-radius: 2px; min-width: 160px; }
  .meter > i { position: absolute; inset: 0 auto 0 0; background: var(--navy-2); border-radius: 2px; }
  .meter > i.lo { background: var(--ko); } .meter > i.mid { background: #c98a00; } .meter > i.hi { background: var(--ok); }
  .meter > s { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); left: 85%; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; }
  .plan li { margin: 3px 0; }
  .pill { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 10px; background: #edf0f3; color: #33404d; }
  .pill.ok { background: var(--ok-bg); color: var(--ok); } .pill.ko { background: var(--ko-bg); color: var(--ko); } .pill.warn { background: var(--warn-bg); color: var(--warn); }

  /* review screen */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
  .cell { border: 1px solid var(--line); padding: 6px 10px; border-radius: 3px; cursor: pointer; display: flex; justify-content: space-between; gap: 6px; font-size: 14px; background: #fff; }
  .cell:hover { background: #f1f4f7; }
  .cell.inc { background: #fff; border-color: var(--ko); }
  .cell .st { font-size: 12px; color: var(--muted); }
  .cell.inc .st { color: var(--ko); }
  .modal-bg { position: fixed; inset: 0; background: rgba(10, 20, 30, .45); display: flex; align-items: center; justify-content: center; z-index: 10; }
  .modal { background: #fff; max-width: 480px; padding: 22px 24px; border-radius: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  .modal .actions { justify-content: flex-end; margin-top: 18px; }
  details.item { border: 1px solid var(--line); border-radius: 3px; margin: 6px 0; }
  details.item > summary { padding: 8px 12px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
  details.item > div { padding: 0 14px 12px; }
  .err { color: var(--ko); padding: 20px; }
</style>
</head>
<body>
<header class="top">
  <div class="title" id="hTitle">Claude Certified Architect – Foundations (CCAR-F)</div>
  <div class="meta">
    <span id="hMode"></span>
    <span class="timer" id="hTimer"></span>
    <span id="hCount"></span>
  </div>
</header>
<main id="main"><div class="wrap">Caricamento…</div></main>
<footer class="bar" id="footer"></footer>

<script>
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const DOM_SHORT = {1: "Agentic", 2: "Tool/MCP", 3: "Claude Code", 4: "Prompt/Output", 5: "Context/Reliability"};
const PLAN = [
  ["Giorno 1", "Baseline: mock da 60 senza studiare", {mock: "baseline"}],
  ["Giorno 2", "Agentic Architecture & Orchestration", {domain: 1}],
  ["Giorno 3", "Tool Design & MCP Integration", {domain: 2}],
  ["Giorno 4", "Claude Code Configuration & Workflows", {domain: 3}],
  ["Giorno 5", "Prompt / Context / Reliability", {domain: 4, alt: 5}],
  ["Giorno 6", "2 mock finali (domande mai viste)", {mock: "final"}],
  ["Giorno 7", "Errori ricorrenti + esame", {missed: true}],
];

/* ---------- tiny DOM helpers: bank text always goes through textContent ---------- */
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") n.className = v;
    else if (k === "text") n.textContent = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) n.append(c.nodeType ? c : document.createTextNode(String(c)));
  return n;
}
function setMain(...kids) { const m = $("#main"); m.replaceChildren(el("div", {class: "wrap"}, ...kids)); m.scrollTop = 0; }
function setFooter(...kids) { $("#footer").replaceChildren(...kids); }
function header(mode = "", count = "", timer = "") { $("#hMode").textContent = mode; $("#hCount").textContent = count; $("#hTimer").replaceChildren(timer ? el("span", {}, "Time Remaining ", el("b", {text: timer})) : ""); }
const pct = x => x === null || x === undefined ? "—" : Math.round(x * 100) + "%";
const meterCls = x => x === null ? "" : x < 0.6 ? "lo" : x < 0.85 ? "mid" : "hi";
function meter(x) { return el("div", {class: "meter", title: pct(x)}, el("i", {class: meterCls(x), style: `width:${Math.round((x || 0) * 100)}%`}), el("s", {title: "target 85%"})); }

async function api(path, body) {
  const r = await fetch(path, body === undefined ? {} : {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
function fail(e) { console.error(e); setMain(el("div", {class: "err", text: "Errore: " + e.message}), el("button", {onclick: home}, "Torna alla dashboard")); }

let keyHandler = null;
document.addEventListener("keydown", e => { if (keyHandler && !e.metaKey && !e.ctrlKey && !e.altKey) keyHandler(e); });

/* ---------- dashboard ---------- */
async function home() {
  keyHandler = null; stopTimer();
  header("Dashboard", "", "");
  try {
    const s = await api("/api/stats");
    const rows = Object.entries(s.mastery).map(([d, m]) => el("tr", {},
      el("td", {}, el("b", {text: `D${d} `}), m.name),
      el("td", {class: "num", text: `${Math.round(m.weight * 100)}%`}),
      el("td", {}, meter(m.accuracy)),
      el("td", {class: "num", text: m.recent_n ? `${pct(m.accuracy)} (${m.recent_ok}/${m.recent_n})` : "—"}),
      el("td", {class: "num", text: `${m.seen_questions}/${m.bank_questions}`}),
      el("td", {}, el("button", {onclick: () => practice(+d)}, "Allena"))));
    const mocks = s.mocks.length ? el("table", {}, el("tr", {}, el("th", {text: "Mock"}), el("th", {text: "Tipo"}), el("th", {text: "Punteggio"}), el("th", {})),
      ...s.mocks.map(m => el("tr", {}, el("td", {text: m.id}), el("td", {text: m.kind}),
        el("td", {}, el("span", {class: "pill " + (m.score >= s.target ? "ok" : m.score >= 0.72 ? "warn" : "ko"), text: `${pct(m.score)} (${m.ok}/${m.n})`})),
        el("td", {}, el("button", {onclick: () => showResult(m.id)}, "Rivedi")))))
      : el("p", {class: "sub", text: "Nessun mock completato."});
    setMain(
      el("h1", {text: "CCAR-F Trainer"}),
      el("p", {class: "sub", text: "Domande in inglese come all'esame, spiegazioni e regole in italiano. Obiettivo: ≥85% stabile sui mock nuovi."}),
      el("div", {class: "kpis"},
        kpi(pct(s.weighted_mastery), "mastery pesata"), kpi(`${s.correct}/${s.answered}`, "risposte corrette"),
        kpi(s.streak, "streak"), kpi(s.due_now, "ripassi pronti"), kpi(s.never_seen, "mai viste"), kpi(s.reserved_unseen, "riservate ai mock")),
      el("h2", {text: "Mastery per dominio (ultime 20 risposte)"}),
      el("table", {}, el("tr", {}, ...["Dominio", "Peso", "", "Accuratezza", "Viste", ""].map(t => el("th", {text: t}))), ...rows),
      s.open_mocks.length ? el("div", {class: "rule"}, el("h4", {text: "Mock non consegnato"}),
        ...s.open_mocks.map(m => el("div", {}, `${m.kind} ${m.id} · ${m.answered} risposte `, el("button", {class: "primary", onclick: () => resumeMock(m.id)}, "Riprendi")))) : null,
      el("h2", {text: "Allenamento"}),
      el("div", {class: "actions"},
        el("button", {class: "primary", onclick: () => practice(null)}, "Pratica adattiva (tutti i domini)"),
        el("button", {onclick: () => startMock("baseline")}, "Mock baseline (60 · 120 min)"),
        el("button", {onclick: () => startMock("final")}, "Mock finale – domande mai viste"),
        el("button", {onclick: missedList}, "Errori")),
      el("h2", {text: "Piano 7 giorni"}),
      el("ol", {class: "plan"}, ...PLAN.map(([g, t, a]) => el("li", {}, el("b", {text: g + ": "}), t, " ",
        a.mock ? el("button", {onclick: () => startMock(a.mock)}, "Avvia") :
        a.missed ? el("button", {onclick: missedList}, "Apri errori") :
        [el("button", {onclick: () => practice(a.domain)}, "D" + a.domain), a.alt ? el("button", {onclick: () => practice(a.alt)}, "D" + a.alt) : null]))),
      el("h2", {text: "Storico mock"}), mocks);
    setFooter(el("span", {class: "pill", text: "Tasti: A–E seleziona · Invio conferma/avanti"}));
  } catch (e) { fail(e); }
}
function kpi(v, l) { return el("div", {class: "kpi"}, el("div", {class: "v", text: String(v)}), el("div", {class: "l", text: l})); }

/* ---------- question rendering (shared) ---------- */
function renderQuestion(q, selected, onChange, {locked = false, result = null} = {}) {
  const type = q.multi ? "checkbox" : "radio";
  const opts = q.options.map(o => {
    const input = el("input", {type, name: "opt", value: o.key, disabled: locked});
    input.checked = selected.includes(o.key);
    const cls = ["opt"];
    if (input.checked) cls.push("checked");
    if (result) { if (result.correct_answer.includes(o.key)) cls.push("right"); else if (input.checked) cls.push("wrong"); }
    input.addEventListener("change", () => onChange(o.key, input.checked));
    return el("label", {class: cls.join(" ")}, input, el("span", {class: "k", text: o.key + "."}), el("span", {text: o.text}));
  });
  return el("div", {},
    el("details", {class: "scenario", open: true}, el("summary", {text: "Scenario: " + q.scenario}), el("p", {text: q.scenario_text})),
    el("p", {class: "stem", text: q.stem}),
    q.multi ? el("p", {class: "pickhint", text: `Select ${q.pick}.`}) : null,
    el("div", {class: "opts", role: type === "radio" ? "radiogroup" : "group"}, ...opts));
}
function toggle(sel, q, key, on) {
  if (!q.multi) return on ? [key] : sel;
  const s = new Set(sel); on ? s.add(key) : s.delete(key); return [...s].sort();
}
function letterKey(e, q) {
  const k = e.key.toUpperCase();
  return q.options.some(o => o.key === k) ? k : null;
}

/* ---------- practice mode ---------- */
let P = null;
async function practice(domain) {
  stopTimer();
  P = {domain, n: P && P.domain === domain ? P.n : 0, ok: P && P.domain === domain ? P.ok : 0};
  try { P.q = await api("/api/next" + (domain ? `?domain=${domain}` : "")); } catch (e) { return fail(e); }
  P.sel = []; P.fb = null;
  if (P.q.lesson) return showLesson();
  drawPractice();
}
function showLesson() {
  const L = P.q.lesson;
  header("Micro-lezione", "", "");
  setMain(el("div", {class: "lesson-card"},
    el("h3", {text: `Micro-lezione · ${L.task} ${L.title}`}),
    el("p", {text: `Hai sbagliato questa domanda ${P.q.times_wrong} volte. Prima di riprovarla, ripassa la regola:`}),
    el("p", {}, el("b", {text: L.rule_it}))));
  setFooter(el("button", {onclick: home}, "Dashboard"), el("span", {class: "spacer"}),
    el("button", {class: "primary", onclick: drawPractice}, "Ho capito, mostra la domanda"));
  keyHandler = e => { if (e.key === "Enter") drawPractice(); };
}
function drawPractice() {
  const q = P.q;
  const tag = {review: "ripasso", new: "nuova", refresh: "rinfresco"}[q.reason] || q.reason;
  header(`Practice${P.domain ? " · D" + P.domain : ""} · ${P.ok}/${P.n}`, `Q ${q.id}`, "");
  const body = renderQuestion(q, P.sel, (k, on) => { P.sel = toggle(P.sel, q, k, on); drawPractice(); }, {locked: !!P.fb, result: P.fb});
  setMain(el("div", {class: "qhead"},
      el("span", {text: `D${q.domain} · ${q.domain_name}`}), el("span", {text: `Task ${q.task}`}),
      el("span", {class: "pill" + (q.reason === "review" ? " warn" : ""), text: tag})),
    body, P.fb ? feedback(P.fb, q) : null);
  const canSubmit = P.sel.length === q.pick && !P.fb;
  setFooter(el("button", {onclick: home}, "Dashboard"), el("span", {class: "spacer"}),
    P.fb ? el("button", {class: "primary", onclick: () => practice(P.domain)}, "Next question →")
         : el("button", {class: "primary", disabled: !canSubmit, onclick: submitPractice}, "Submit answer"));
  keyHandler = e => {
    if (e.key === "Enter") { e.preventDefault(); P.fb ? practice(P.domain) : canSubmit && submitPractice(); return; }
    const k = !P.fb && letterKey(e, q);
    if (k) { P.sel = toggle(P.sel, q, k, !P.sel.includes(k)); drawPractice(); }
  };
}
async function submitPractice() {
  try { P.fb = await api("/api/answer", {qid: P.q.id, answer: P.sel}); } catch (e) { return fail(e); }
  P.n++; if (P.fb.correct) P.ok++;
  drawPractice();
  $(".fb") && $(".fb").scrollIntoView({behavior: "smooth", block: "start"});
}
function feedback(fb, q) {
  const before = fb.mastery_before, after = fb.mastery_after;
  const arrow = after > before ? "↑" : after < before ? "↓" : "→";
  return el("div", {class: "fb"},
    el("div", {class: "verdict " + (fb.correct ? "ok" : "ko"), text: fb.correct ? "✅ Corretta" : `❌ Sbagliata — corretta: ${fb.correct_answer.join(", ")}`}),
    el("div", {class: "rule"}, el("h4", {text: `Regola da ricordare · ${fb.lesson.task} ${fb.lesson.title}`}), el("div", {text: fb.lesson.rule_it})),
    ...explanation(fb, q),
    el("p", {class: "mastery-delta", text: `${DOM_SHORT[fb.domain]} mastery: ${pct(before)} → ${pct(after)} ${arrow}` +
      (fb.next_review_in !== null ? ` · questa domanda torna tra ${fb.next_review_in} risposte` : "")}),
    fb.citation ? el("p", {class: "cite"}, "Fonte: ", el("a", {href: fb.citation, target: "_blank", rel: "noopener noreferrer", text: fb.citation})) : null);
}

function bilingual(it, en) {
  if (!it) return [el("span", {text: en || ""})];
  return [el("span", {text: it}), el("details", {class: "orig"}, el("summary", {text: "Originale (EN)"}), el("span", {text: en}))];
}
function explanation(fb, q) {
  if (!Object.keys(fb.rationale || {}).length)
    return [el("div", {}, el("b", {text: "Perché:"})), el("div", {class: "why c"}, ...bilingual(fb.explanation_it, fb.explanation))];
  const it = fb.rationale_it || {};
  return [el("div", {}, el("b", {text: "Perché (spiegazione per ogni opzione):"})),
    ...q.options.map(o => el("div", {class: "why" + (fb.correct_answer.includes(o.key) ? " c" : "")},
      el("b", {text: o.key + (fb.correct_answer.includes(o.key) ? " ✓" : " ✗")}), ...bilingual(it[o.key], fb.rationale[o.key])))];
}

/* ---------- mock exam ---------- */
let M = null, timerId = null;
function stopTimer() { if (timerId) clearInterval(timerId); timerId = null; }
async function startMock(kind) {
  const ok = await confirmBox(kind === "final" ? "Mock finale" : "Mock baseline",
    "60 domande · 4 scenari scelti a caso tra 6 · 120 minuti. Nessun feedback fino alla consegna, come all'esame. Iniziare?", "Start exam");
  if (!ok) return;
  try { runMock(await api("/api/mock/start", {kind})); } catch (e) { fail(e); }
}
async function resumeMock(id) { try { runMock(await api(`/api/mock/${id}`)); } catch (e) { fail(e); } }
function runMock(m) {
  M = m; M.skew = M.server_now * 1000 - Date.now(); M.i = 0;
  stopTimer(); timerId = setInterval(tick, 1000); tick();
  if (timerId) drawMock();
}
function remainingSec() { return Math.max(0, Math.round(M.started + M.minutes * 60 - (Date.now() + M.skew) / 1000)); }
function tick() {
  const r = remainingSec(), h = Math.floor(r / 3600), m = Math.floor(r % 3600 / 60), s = r % 60;
  header(M.kind === "final" ? "Final mock" : "Baseline mock", $("#hCount").textContent, `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`);
  $("#hTimer").classList.toggle("low", r < 600);
  if (r === 0) { stopTimer(); submitMock(true); }
}
let saveT = null;
function saveSoon() { clearTimeout(saveT); saveT = setTimeout(() => api(`/api/mock/${M.id}/save`, {answers: M.answers, flags: M.flags}).catch(console.error), 600); }
function drawMock() {
  const q = M.questions[M.i], sel = M.answers[q.id] || [], flagged = M.flags.includes(q.id);
  $("#hCount").textContent = `Question ${M.i + 1} of ${M.questions.length}`;
  setMain(renderQuestion(q, sel, (k, on) => { M.answers[q.id] = toggle(sel, q, k, on); if (!M.answers[q.id].length) delete M.answers[q.id]; saveSoon(); drawMock(); }));
  setFooter(
    el("button", {class: flagged ? "flag-on" : "", onclick: () => { M.flags = flagged ? M.flags.filter(x => x !== q.id) : [...M.flags, q.id]; saveSoon(); drawMock(); }}, flagged ? "⚑ Flagged" : "⚐ Flag for Review"),
    el("span", {class: "spacer"}),
    el("button", {disabled: M.i === 0, onclick: () => { M.i--; drawMock(); }}, "◀ Previous"),
    M.i < M.questions.length - 1 ? el("button", {class: "primary", onclick: () => { M.i++; drawMock(); }}, "Next ▶")
      : el("button", {class: "primary", onclick: () => reviewScreen()}, "Review Screen"),
    el("button", {onclick: () => reviewScreen()}, "Review"));
  keyHandler = e => {
    if (e.key === "ArrowRight" || e.key === "Enter") { if (M.i < M.questions.length - 1) { M.i++; drawMock(); } else reviewScreen(); return; }
    if (e.key === "ArrowLeft" && M.i > 0) { M.i--; drawMock(); return; }
    const k = letterKey(e, q);
    if (k) { M.answers[q.id] = toggle(sel, q, k, !sel.includes(k)); if (!M.answers[q.id].length) delete M.answers[q.id]; saveSoon(); drawMock(); }
  };
}
function isComplete(q) { return (M.answers[q.id] || []).length === q.pick; }
function reviewScreen(filter = "all") {
  keyHandler = null;
  $("#hCount").textContent = "Review Screen";
  const inc = M.questions.filter(q => !isComplete(q)).length;
  const groups = M.scenarios.map(scn => el("div", {},
    el("h2", {text: scn}),
    el("div", {class: "grid"}, ...M.questions.map((q, i) => ({q, i})).filter(({q}) => q.scenario === scn)
      .filter(({q}) => filter === "all" || (filter === "inc" && !isComplete(q)) || (filter === "flag" && M.flags.includes(q.id)))
      .map(({q, i}) => el("div", {class: "cell" + (isComplete(q) ? "" : " inc"), onclick: () => { M.i = i; drawMock(); }},
        el("span", {}, `Question ${i + 1}`, M.flags.includes(q.id) ? " ⚑" : ""), el("span", {class: "st", text: isComplete(q) ? "Answered" : "Incomplete"}))))));
  setMain(el("h1", {text: "Review Screen"}),
    el("p", {class: "sub", text: `${M.questions.length - inc} answered · ${inc} incomplete · ${M.flags.length} flagged. Click a question to return to it.`}),
    ...groups);
  setFooter(el("button", {onclick: () => reviewScreen("all")}, "Review All"), el("button", {onclick: () => reviewScreen("inc")}, "Review Incomplete"),
    el("button", {onclick: () => reviewScreen("flag")}, "Review Flagged"), el("span", {class: "spacer"}),
    el("button", {class: "primary", onclick: () => submitMock(false)}, "End Exam"));
}
async function submitMock(timeUp) {
  if (!timeUp) {
    const inc = M.questions.filter(q => !isComplete(q)).length;
    if (!await confirmBox("End Exam", `${inc ? inc + " questions are incomplete and will be scored as incorrect. " : ""}After you end the exam you cannot change your answers.`, "End Exam")) return;
  }
  stopTimer(); clearTimeout(saveT);
  try { const r = await api(`/api/mock/${M.id}/submit`, {answers: M.answers, flags: M.flags}); drawResult(r); } catch (e) { fail(e); }
}
async function showResult(id) { try { drawResult(await api(`/api/mock/${id}/result`)); } catch (e) { fail(e); } }
function drawResult(r) {
  keyHandler = null; stopTimer();
  header("Score report", "", "");
  const pass = r.score >= r.target;
  setMain(el("h1", {text: `Score report — ${pct(r.score)} (${r.ok}/${r.n})`}),
    el("p", {class: "sub"}, el("span", {class: "pill " + (pass ? "ok" : r.score >= 0.72 ? "warn" : "ko"),
      text: pass ? "Sopra target 85%" : r.score >= 0.72 ? "Sopra 72% ma sotto target 85%" : "Sotto 72%"}),
      ` · durata ${r.duration_min} min · il punteggio reale è scalato (720/1000) e non coincide con la percentuale`),
    el("h2", {text: "Per dominio"}),
    el("table", {}, ...Object.entries(r.by_domain).map(([d, v]) => el("tr", {}, el("td", {text: `D${d} ${v.name}`}), el("td", {}, meter(v.ok / v.n)), el("td", {class: "num", text: `${pct(v.ok / v.n)} (${v.ok}/${v.n})`})))),
    el("h2", {text: "Per scenario"}),
    el("table", {}, ...Object.entries(r.by_scenario).map(([s, v]) => el("tr", {}, el("td", {text: s}), el("td", {}, meter(v.ok / v.n)), el("td", {class: "num", text: `${pct(v.ok / v.n)} (${v.ok}/${v.n})`})))),
    el("h2", {text: "Domande (sbagliate per prime)"}),
    ...[...r.items].sort((a, b) => a.ok - b.ok).map(it => el("details", {class: "item"},
      el("summary", {}, el("span", {class: "pill " + (it.ok ? "ok" : "ko"), text: it.ok ? "✓" : "✗"}), el("span", {text: `D${it.domain} · ${it.task} · ${it.stem.slice(0, 110)}…`})),
      el("div", {}, renderQuestion(it, it.your_answer, () => {}, {locked: true, result: it}), feedback({...it, correct: it.ok, mastery_before: null, mastery_after: null, next_review_in: null, domain: it.domain}, it)))));
  document.querySelectorAll(".mastery-delta").forEach(n => n.remove());
  setFooter(el("button", {class: "primary", onclick: home}, "Dashboard"));
}

/* ---------- missed list ---------- */
async function missedList() {
  keyHandler = null; stopTimer(); header("Errori", "", "");
  try {
    const xs = await api("/api/missed");
    setMain(el("h1", {text: `Errori (${xs.length})`}),
      el("p", {class: "sub", text: "Ordinati per numero di errori. «tra N» = quante risposte mancano al ripasso automatico."}),
      xs.length ? el("table", {}, el("tr", {}, ...["Q", "Dominio", "Task", "Errori", "Streak", "Ripasso", "Domanda", ""].map(t => el("th", {text: t}))),
        ...xs.map(x => el("tr", {}, el("td", {text: x.qid}), el("td", {text: "D" + x.domain}), el("td", {text: x.task}),
          el("td", {}, el("span", {class: "pill ko", text: String(x.wrong)})), el("td", {text: String(x.streak)}),
          el("td", {class: "num", text: x.due_in === null ? "—" : x.due_in <= 0 ? "pronto" : `tra ${x.due_in}`}),
          el("td", {text: x.stem}), el("td", {}, el("button", {onclick: () => retry(x.qid)}, "Riprova"))))) : el("p", {text: "Nessun errore registrato."}));
    setFooter(el("button", {class: "primary", onclick: home}, "Dashboard"));
  } catch (e) { fail(e); }
}
async function retry(qid) {
  try { const q = await api(`/api/question?id=${encodeURIComponent(qid)}`); P = {domain: null, n: 0, ok: 0, q: {...q, reason: "review"}, sel: [], fb: null}; drawPractice(); } catch (e) { fail(e); }
}

/* ---------- modal ---------- */
function confirmBox(title, text, okLabel) {
  return new Promise(res => {
    const prev = keyHandler;
    const close = v => { bg.remove(); keyHandler = prev; res(v); };
    const okBtn = el("button", {class: "primary", onclick: () => close(true)}, okLabel);
    const bg = el("div", {class: "modal-bg", onclick: e => { if (e.target === bg) close(false); }},
      el("div", {class: "modal", role: "dialog", "aria-modal": "true"}, el("h2", {text: title, style: "margin-top:0"}), el("p", {text}),
        el("div", {class: "actions"}, el("button", {onclick: () => close(false)}, "Cancel"), okBtn)));
    document.body.append(bg); okBtn.focus();
    keyHandler = e => { if (e.key === "Escape") close(false); };
  });
}

home();
</script>
